<style>
  :root {
    --green-900: #0d3b1f;
    --green-800: #145a2c;
    --gold:      #b78b3a;
    --cream:     #faf4e7;
    --ink:       #1a2b22;
    --muted:     #6b7a72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    width: 100%;
  }
  .logo-mark {
    height: 60px;
    margin: 0 auto 40px;
    display: block;
  }
  .check {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--green-800);
    color: #fff;
    margin: 0 auto 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 40px rgba(13, 59, 31, 0.25);
    animation: pop .55s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 8vw, 78px);
    font-weight: 600;
    color: var(--green-900);
    line-height: 1.05;
    letter-spacing: 0.02em;
    margin-bottom: 18px;
  }
  h1 .accent {
    color: var(--gold);
    font-style: italic;
    font-weight: 500;
  }
  .lead {
    font-size: 17px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 14px;
  }
  .lead strong { color: var(--green-900); font-weight: 600; }
  .divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 36px auto;
  }
  .next {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 36px;
  }
  .next a {
    color: var(--green-800);
    text-decoration: none;
    font-weight: 600;
  }
  .next a:hover { color: var(--gold); }
  .btn {
    display: inline-block;
    background: var(--green-800);
    color: #fff;
    padding: 14px 36px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: background .2s, transform .2s;
  }
  .btn:hover { background: var(--green-900); transform: translateY(-2px); }
  @media (max-width: 480px) {
    .check { width: 78px; height: 78px; }
    .logo-mark { height: 48px; margin-bottom: 30px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo-mark" src="../logo/reverence%20ashadeep.png" alt="Reverence Realty by Ashadeep" />

    <div class="check">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <h1>Thank <span class="accent">You</span></h1>
    <p class="lead">Your enquiry has been received.</p>
    <p class="lead"><strong>Our team will reach out to you shortly.</strong></p>

    <div class="divider"></div>

    <p class="next">Need to speak with us now? <a href="tel:+919309361000">Call +91 9309361000</a></p>

    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
